<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP2 4</title>
    <style>

.papa{
    display: flex;
padding: 20px;

}
.calc{
    height: 500px;
    width: 300px;
background-color: gray;
border : 2px black solid;
padding: 20px;
border-radius: 20px;

grid-template-columns: repeat(4, 1fr);
align-content: end;
display:grid;
gap:15px;

}
#btn0{
    grid-column: 2 span;
}
.calc button{
width: 100%;
            height: 50px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
}
.resultats {
            grid-column: span 4;
            height: 60px;
            background-color: white;
            border-radius: 8px;
            margin-bottom: 50px;}

    </style>
</head>
<body>
    
    <div class="papa">
<div class="calc">
<div class="resultats"></div>

            <button id="btnC">C</button>
            <button id="btnErase">⌫</button>
            <button id="btnD">/</button>
            <button id="btnMulti">*</button>

          
         
           
             
               <button id="btn7">7</button>
                  <button id="btn8">8</button>
                   <button id="btn9">9</button>
  <button id="btnMoins">-</button>

               <button id="btn4">4</button>
                       <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="btnPlus">+</button>

            <button id="btn1">1</button>
             <button id="btn2">2</button>
            <button id="btn3">3</button>
           
            <button id="btnEgale">=</button>

            <button id="btn0">0</button>
            <button id="btnPoint">.</button>

        </div>
    </div>

    <script>

    let resultat = document.querySelector(".resultats");

    let expression = "";
    let termine = false;

    let chiffres = [
        "btn0", "btn1", "btn2", "btn3", "btn4",
        "btn5", "btn6", "btn7", "btn8", "btn9"
    ];

    chiffres.forEach(function(id) {
        document.getElementById(id).onclick = function() {
            if (termine) {
                expression = "";
                termine = false;
            }

            expression += this.textContent.trim();
            resultat.textContent = expression;
        };
    });

    document.getElementById("btnPoint").onclick = function() {
        if (termine) {
            expression = "";
            termine = false;
        }

        let nombres = expression.split(/[+\-×÷]/);
        let dernier = nombres[nombres.length - 1];

        if (!dernier.includes(".")) {
            if (dernier === "") {
                expression += "0";
            }

            expression += ".";
            resultat.textContent = expression;
        }
    };

    document.getElementById("btnPlus").onclick = function() {
        ajouterOperation("+");
    };

    document.getElementById("btnMoins").onclick = function() {
        ajouterOperation("-");
    };

    document.getElementById("btnMulti").onclick = function() {
        ajouterOperation("×");
    };

    document.getElementById("btnD").onclick = function() {
        ajouterOperation("÷");
    };

    function ajouterOperation(op) {
        if (expression === "" && op !== "-") {
            return;
        }

        if (termine) {
            termine = false;
        }

        let dernier = expression[expression.length - 1];

        if (["+", "-", "×", "÷"].includes(dernier)) {
            expression = expression.slice(0, -1);
        }

        expression += op;
        resultat.textContent = expression;
    }

    document.getElementById("btnEgale").onclick = function() {
        if (expression === "") {
            return;
        }

        try {
            let parties = expression.match(/(?:\d+\.?\d*|\.\d+)|[+\-×÷]/g);

            if (!parties || parties.join("") !== expression) {
                return;
            }

            if (["+", "-", "×", "÷"].includes(parties[parties.length - 1])) {
                return;
            }

            let nombres = [];
            let operations = [];

            for (let i = 0; i < parties.length; i++) {
                if (i % 2 === 0) {
                    nombres.push(Number(parties[i]));
                } else {
                    operations.push(parties[i]);
                }
            }

            for (let i = 0; i < operations.length; i++) {
                if (operations[i] === "×" || operations[i] === "÷") {
                    let valeur;

                    if (operations[i] === "×") {
                        valeur = nombres[i] * nombres[i + 1];
                    } else {
                        if (nombres[i + 1] === 0) {
                            resultat.textContent = "Erreur";
                            expression = "";
                            termine = true;
                            return;
                        }

                        valeur = nombres[i] / nombres[i + 1];
                    }

                    nombres.splice(i, 2, valeur);
                    operations.splice(i, 1);
                    i--;
                }
            }

            let total = nombres[0];

            for (let i = 0; i < operations.length; i++) {
                if (operations[i] === "+") {
                    total += nombres[i + 1];
                } else {
                    total -= nombres[i + 1];
                }
            }

            if (!Number.isFinite(total)) {
                resultat.textContent = "Erreur";
                expression = "";
                termine = true;
                return;
            }

            total = Number(total.toPrecision(12));
            expression = String(total);
            resultat.textContent = expression;
            termine = true;

        } catch (e) {
            resultat.textContent = "Erreur";
            expression = "";
            termine = true;
        }
    };

    document.getElementById("btnC").onclick = function() {
        expression = "";
        termine = false;
        resultat.textContent = "0";
    };

    document.getElementById("btnErase").onclick = function() {
        if (termine) {
            expression = "";
            termine = false;
        } else {
            expression = expression.slice(0, -1);
        }

        resultat.textContent = expression || "0";
    };
</script>

   
</body>
</html>
