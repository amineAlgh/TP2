<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TP2 7</title>

    <style>

        body {
            text-align: center;
            font-family: Arial;
        }

        #timer {
            font-size: 40px;
            margin-top: 100px;
        }

    </style>
</head>

<body>

    <h1>Chronomètre</h1>

    <div id="timer">0 secondes</div>

    <script>

        var temps = 0;

        var timer = document.getElementById("timer");

        setInterval(function() {

            temps = temps + 1;

            timer.innerHTML = temps + " secondes";

        }, 1000);

    </script>

</body>
</html>
